[package]
name = "chatai"
version = "0.1.0"
description = "Chat application unifying WhatsApp and Telegram with local Ollama AI support"
authors = ["ChatAI Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
r2d2 = "0.8"
r2d2_sqlite = "0.25"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1.0"
dotenv = "0.15"
log = "0.4"
env_logger = "0.10"

[features]
# By default all built-in commands are enabled
default = ["tauri/default"]

[profile.release]
opt-level = "z"     # Optimize for size.
lto = true
codegen-units = 1
strip = true
